[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ogda"
version = "0.1.0"
description = "OGDA: Ontology-Grounded Data Agents for Reliable Analysis over Heterogeneous Data Lakes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "pandas>=2", "pyarrow>=14", "duckdb>=1", "openpyxl>=3", "PyYAML>=6", "scipy>=1.11", "statsmodels>=0.14", "litellm>=1", "openai>=1", "smolagents==1.26.0"]

[project.optional-dependencies]
benchmarks = ["typeguard>=4", "rouge-score>=0.1.2", "nltk>=3.8", "ollama>=0.4", "untruncate-json>=1", "sympy>=1.12", "ipython>=8", "tenacity>=8"]

[project.scripts]
ogda = "ogda.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ogda*"]

[tool.setuptools.package-data]
ogda = ["models/*.yaml"]
